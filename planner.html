
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Planner</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cherry+Bomb+One&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/p5@1.9.0/lib/p5.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="dragon-screensaver.js" defer></script>
  <script src="planner.js" defer></script>
</head>
<body>
  <div class="banner">
    <div class="navbar">
      <img src="icon.png" class="logo" alt="Logo" />
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="planner.html">Planner</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </div>
    <div class="content">
      <h1>Welcome to Your Garden Planner</h1>
      <p>Design your garden layout with climate-appropriate plants.</p>
    </div>
  </div>

  <!-- Planner Section -->
  <div id="planner-container">
    <div id="plant-palette">
      <h2>Available Plants (Saskatchewan)</h2>
      <div class="plant" draggable="true" data-plant="tomato">🍅</div>
      <div class="plant" draggable="true" data-plant="carrot">🥕</div>
      <div class="plant" draggable="true" data-plant="lettuce">🥬</div>
      <div class="plant" draggable="true" data-plant="potato">🥔</div>
      <div class="plant" draggable="true" data-plant="pea">🫛</div>
      <div class="plant" draggable="true" data-plant="corn">🌽</div>
      <div class="plant" draggable="true" data-plant="strawberry">🍓</div>
      <div class="plant" draggable="true" data-plant="cabbage">🥦</div>
      <div class="plant" draggable="true" data-plant="custom">❓</div>
      <div class="plant" draggable="true" data-plant="nonland">⬛</div>
    </div>

    <div id="garden-grid"></div>

    <div id="compatibility-legend">
      <h3>Compatibility Key</h3>
      <div class="legend-item"><span class="legend-color good"></span> Good</div>
      <div class="legend-item"><span class="legend-color bad"></span> Bad</div>
    </div>

    <button id="download-btn">Download Plot as PNG</button>
  </div>

  <div class="version-text">Version 3.2.2</div>
  <div id="screensaver" style="display:none; position:fixed; top:0; left:0; width:100vw; height:100vh; z-index:9999;"></div>
</body>
</html>
