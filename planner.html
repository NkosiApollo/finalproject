<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Garden Planner</title>

    <link rel="icon" href="icon.png">

    <link rel="stylesheet" href="style2.css">

    <script src="https://cdn.jsdelivr.net/npm/p5@1.9.0/lib/p5.min.js"></script>
    <script src="dragon-screensaver.js" defer></script>

<style>
  /* Buttons */
  button {
    width: 200px;
    padding: 15px 0;
    text-align: center;
    margin: 20px 10px;
    border-radius: 25px;
    border: none;
    background-color: #8f5a30;
    color: #fff;
    cursor: pointer;
    transition: background-color 0.3s ease;
  }
  button:hover {
    background-color: #834123;
  }

  /* Planner Grid Container */
  #garden-grid {
    display: grid;
    grid-template-columns: repeat(10, 1fr);
    grid-auto-rows: 60px;
    gap: 6px;
    width: 620px;
    margin: 20px auto;
    background-color: #e5e5e5;
    border-radius: 10px;
    padding: 10px;
    box-shadow: inset 0 0 8px rgba(180, 130, 72, 0.877);
  }

  /* Individual Grid Cells */
  #garden-grid > div.grid-cell {
    border: 1px solid #ccc;
    background-color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 1.5rem;
    user-select: none;
    cursor: pointer;
    border-radius: 6px;
    transition: background-color 0.3s ease;
  }

  /* Plant Palette */
  #plant-palette {
    max-width: 620px;
    margin: 20px auto;
    display: flex;
    gap: 15px;
    font-size: 2rem;
    justify-content: center;
    flex-wrap: wrap;  /* <-- Fix added here */
  }

  #plant-palette .plant {
    user-select: none;
    cursor: grab;
    padding: 8px 15px;
    border-radius: 8px;
    background-color: #f0f0f0;
    border: 2px solid transparent;
    transition: border-color 0.3s ease;
  }

  #plant-palette .plant:active {
    cursor: grabbing;
    border-color: #555;
  }
</style>
</head>
<body>
  <div class="banner">
    <div class="navbar">
        <img src="icon.png" class="logo">
          <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="planner.html">Planner</a></li>
            <li><a href="contact.html">Contact</a></li>
          </ul>
    </div>

    <div id="plant-palette">
      <div class="plant" draggable="true" data-plant="tomato">🍅</div>
      <div class="plant" draggable="true" data-plant="carrot">🥕</div>
      <div class="plant" draggable="true" data-plant="lettuce">🥬</div>
      <div class="plant" draggable="true" data-plant="potato">🥔</div>
      <div class="plant" draggable="true" data-plant="pea">🫛</div>
      <div class="plant" draggable="true" data-plant="corn">🌽</div>
      <div class="plant" draggable="true" data-plant="strawberry">🍓</div>
      <div class="plant" draggable="true" data-plant="cabbage">🥦</div>
      <div class="plant" draggable="true" data-plant="cucumber">🥒</div>
      <div class="plant" draggable="true" data-plant="onion">🧅</div>
      <div class="plant" draggable="true" data-plant="sunflower">🌻</div>
      <div class="plant" draggable="true" data-plant="bellpepper">🫑</div>
      <div class="plant" draggable="true" data-plant="flower">🌸</div>
      <div class="plant" draggable="true" data-plant="custom"> ❓</div>
      <div class="plant" draggable="true" data-plant="nonland"> 🟩 </div>
    </div>

    <div id="garden-grid"></div>

    <button id="download-btn">Download Plot</button>
  </div>

<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
<script>
  // Elements
  const plantPalette = document.getElementById("plant-palette");
  const gardenGrid = document.getElementById("garden-grid");
  const downloadBtn = document.getElementById("download-btn");

  // Grid size 10x10
  const gridSize = 10;

  // Plant icons
  const plantIcons = {
    tomato: "🍅",
    carrot: "🥕",
    lettuce: "🥬",
    potato: "🥔",
    pea: "🫛",
    corn: "🌽",
    strawberry: "🍓",
    cabbage: "🥦",
    cucumber: "🥒",
    onion: "🧅",
    sunflower: "🌻",
    bellpepper: "🫑",
    flower: "🌸",
    custom: "❓",
    nonland: "⬛",
  };

  // Compatibility map (Saskatchewan-specific examples)
  const compatibilityMap = {
    tomato: { good: ["carrot", "lettuce", "onion", "cucumber"], bad: ["potato", "corn", "cabbage"] },
    carrot: { good: ["tomato", "pea", "lettuce"], bad: ["dill"] },
    lettuce: { good: ["carrot", "strawberry", "cucumber"], bad: ["cabbage"] },
    potato: { good: ["corn", "cabbage"], bad: ["tomato", "onion"] },
    pea: { good: ["carrot", "lettuce", "cucumber"], bad: ["onion"] },
    corn: { good: ["potato", "cucumber"], bad: ["tomato"] },
    strawberry: { good: ["lettuce"], bad: ["cabbage"] },
    cabbage: { good: ["potato"], bad: ["lettuce", "tomato"] },
    cucumber: { good: ["lettuce", "pea", "sunflower"], bad: ["potato"] },
    onion: { good: ["tomato", "carrot"], bad: ["pea", "potato"] },
    sunflower: { good: ["cucumber"], bad: [] },
    bellpepper: { good: ["onion", "carrot"], bad: ["fennel"] },
    flower: { good: [], bad: [] },
  };

  const compatibilityGood = "#c8e6c9"; // light green
  const compatibilityBad = "#ffcdd2"; // light red

  // Create grid cells
  for (let i = 0; i < gridSize * gridSize; i++) {
    const cell = document.createElement("div");
    cell.dataset.index = i;
    cell.textContent = "";
    cell.style.backgroundColor = "";
    cell.classList.add("grid-cell");

    cell.addEventListener("dragover", (e) => e.preventDefault());
    cell.addEventListener("drop", (e) => {
      e.preventDefault();
      const plant = e.dataTransfer.getData("text/plain");
      const icon = plantIcons[plant] || plantIcons["custom"];

      if (plant === "custom") {
        const name = prompt("Enter custom plant name:", "Custom Plant");
        if (name) {
          cell.textContent = name;
          cell.dataset.plant = name.toLowerCase();
        }
      } else {
        cell.textContent = icon;
        cell.dataset.plant = plant;
      }

      updateCompatibilityColors();
    });

    gardenGrid.appendChild(cell);
  }

  // Drag start event
  const plants = plantPalette.querySelectorAll(".plant");
  plants.forEach((plant) => {
    plant.addEventListener("dragstart", (e) => {
      e.dataTransfer.setData("text/plain", plant.dataset.plant);
    });
  });

  function updateCompatibilityColors() {
    const cells = gardenGrid.children;
    for (let i = 0; i < cells.length; i++) {
      cells[i].style.backgroundColor = "";
    }

    for (let i = 0; i < cells.length; i++) {
      const cell = cells[i];
      const plant = cell.dataset.plant;
      if (!plant || plant === "nonland") continue;

      const compatibility = compatibilityMap[plant] || { good: [], bad: [] };

      const neighbors = [
        i - 1,
        i + 1,
        i - gridSize,
        i + gridSize
      ];

      neighbors.forEach((n) => {
        if (n >= 0 && n < cells.length) {
          const neighborCell = cells[n];
          const neighborPlant = neighborCell.dataset.plant;
          if (!neighborPlant || neighborPlant === "nonland") return;

          if (compatibility.good.includes(neighborPlant)) {
            neighborCell.style.backgroundColor = compatibilityGood;
          } else if (compatibility.bad.includes(neighborPlant)) {
            neighborCell.style.backgroundColor = compatibilityBad;
          }
        }
      });
    }
  }

  // Download plot
  downloadBtn.addEventListener("click", () => {
    html2canvas(gardenGrid).then((canvas) => {
      const link = document.createElement("a");
      link.download = "garden-plot.png";
      link.href = canvas.toDataURL();
      link.click();
    });
  });
</script>

</body>
</html>
