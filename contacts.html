<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="banner">
    <div class="navbar">
      <img src="logo.png" class="logo" alt="Logo">
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="services.html">Services</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </div>
    <div class="content">
      <h1>Contact Us</h1>
      <p>You can reach us at <a href="mailto:info@example.com">info@example.com</a> or use the form below.</p>
      <form>
        <input type="text" placeholder="Your Name" required><br><br>
        <input type="email" placeholder="Your Email" required><br><br>
        <textarea placeholder="Your Message" required></textarea><br><br>
        <button type="submit"><span></span>Send</button>
      </form>
    </div>
  </div>
  <div class="version-text">Version 2.1.1</div>
  <div id="screensaver"></div>
  <script>
    let idleTime = 0;
    let screensaverActive = false;
    const screensaver = document.getElementById('screensaver');
    const resetIdleTimer = () => {
      idleTime = 0;
      if (screensaverActive) {
        screensaver.style.display = 'none';
        screensaverActive = false;
      }
    };
    const startIdleTimer = () => {
      idleTime++;
      if (idleTime > 5 && !screensaverActive) {
        screensaver.style.display = 'block';
        screensaverActive = true;
      }
    };
    window.onload = () => {
      setInterval(startIdleTimer, 1000);
      document.onmousemove = resetIdleTimer;
      document.onkeypress = resetIdleTimer;
      document.onclick = resetIdleTimer;
    };
  </script>
</body>
</html>
